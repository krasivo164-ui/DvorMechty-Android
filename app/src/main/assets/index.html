    s.mergeBoard=isArray(x.mergeBoard)&&x.mergeBoard.length===25?x.mergeBoard.map(t=>t&&ITEMS[t.type]&&Number.isInteger(t.level)&&t.level>=1&&t.level<=4?{type:t.type,level:t.level}:null):initialBoard();
    s.friendship=x.friendship&&typeof x.friendship==='object'&&!isArray(x.friendship)?x.friendship:{};

  }catch(_){return fresh()}
}
let state=load(), tab='home', dialog=null, selected=-1;
let toastTimer=null;
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(state));return true}catch(_){toast('Не удалось сохранить прогресс. Проверь память телефона.');return false}}
function save(){persist();updateTop()}
function regenerate(){if(state.energy>=MAX_ENERGY){state.lastEnergyAt=Date.now();return}const now=Date.now();if(now<state.lastEnergyAt)return;const gained=Math.floor((now-state.lastEnergyAt)/ENERGY_INTERVAL);if(gained>0){state.energy=Math.min(MAX_ENERGY,state.energy+gained);state.lastEnergyAt=state.energy===MAX_ENERGY?now:state.lastEnergyAt+gained*ENERGY_INTERVAL;persist()}}
function updateTop(){el('coins').textContent=state.coins;el('level').textContent=state.level;el('energy').textContent=state.energy+'/'+MAX_ENERGY}
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function btn(label,action,variant='secondary',disabled=false,wide=false){return `<button class="btn btn-${variant}${wide?' btn-wide':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function currentStoryIndex(){return Math.min(4,Math.max(state.story||0,state.places.includes('garden')?4:0,state.buildings.includes('lamp')?3:0,state.buildings.includes('bench')?2:0,state.buildings.includes('bed')?1:0))}
function heroUnlocked(hero){return state.level>=hero.level}
function heroComplete(id){return state.done.includes('char_'+id)}
function heroRequirement(id){switch(id){case 'anya':return state.buildings.includes('bed');case 'misha':return state.buildings.includes('bench');case 'baba':return state.done.includes('find');case 'timur':return state.mergeBest.tool>=2;case 'lera':return state.buildings.includes('lamp');default:return false}}

function heroPicture(id){return INLINE_HEROES[id]}
function questProgress(q){switch(q.id){case 'clean':return state.done.includes('clean')?3:state.cleanupFound.length;case 'hello':return state.talked.length?1:0;case 'find':return state.finds;case 'merge_flower':return state.mergeBest.flower;case 'merge_wood':return state.mergeBest.wood;case 'build_bed':return Number(state.buildings.includes('bed'));case 'build_bench':return Number(state.buildings.includes('bench'));case 'new_friend':return state.talked.length;case 'merge_tool':return state.mergeBest.tool;case 'build_lamp':return Number(state.buildings.includes('lamp'));case 'garden_open':return Number(state.places.includes('garden'));case 'friendship':return HEROES.filter(h=>heroComplete(h.id)).length;case 'flower_master':return state.mergeBest.flower;case 'decorate':return Number(state.decor.length>0);default:return 0}}
function render(){regenerate();updateTop();document.querySelectorAll('.bottomnav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});
  el('screen').innerHTML=`<div class="screen">${({home:homeScreen,merge:mergeScreen,people:peopleScreen,quests:questsScreen,shop:shopScreen})[tab]()}</div>`;
  const overlay=el('overlay');if(dialog){overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Игровое окно">${dialogScreen()}</div>`;overlay.classList.remove('hidden');if(dialog.type==='backup'&&el('save-export'))el('save-export').value=JSON.stringify(state)}else{overlay.innerHTML='';overlay.classList.add('hidden')}
}
function yard(){return `<div class="yard-scene" role="group" aria-label="Зелёный двор с домом и построенными улучшениями">
  <div class="yard-level">🌿 ДВОР · УРОВЕНЬ ${state.level}</div>
  ${BUILDINGS.map(b=>state.buildings.includes(b.id)?`<span class="yard-item obj-${b.id}" title="${b.name}">${b.icon}</span>`:'').join('')}
  ${DECOR.map(d=>state.decor.includes(d.id)?`<span class="yard-item decor-${d.id}" title="${d.name}">${d.icon}</span>`:'').join('')}
  ${HEROES.filter(h=>heroUnlocked(h)).map(h=>`<button class="yard-person person-${h.id}" data-action="talk:${h.id}" title="Поговорить: ${h.name}" aria-label="Поговорить с ${h.name}"><img src="${heroPicture(h.id)}" alt=""><span>${h.name}</span></button>`).join('')}
  <div class="yard-story"><span>📖 ${STORY[currentStoryIndex()][0]}</span><button class="btn btn-gold" style="min-height:32px;padding:6px 10px" data-action="story">Читать</button></div></div>`}
function homeScreen(){
  const next=QUESTS.find(q=>!state.done.includes(q.id)&&questProgress(q)>=q.total)||QUESTS.find(q=>!state.done.includes(q.id));
  return `<div class="hero-intro">${yard()}</div>
  <section class="section"><div class="daily-banner"><span class="gift">🎁</span><div class="body"><b>Подарок нового дня</b><p>${state.lastDailyRewardDate===todayKey()?'Сегодня уже получен. До завтра!':'Награда за вход + энергия для поиска'}</p></div>${btn(state.lastDailyRewardDate===todayKey()?'Получено':'Забрать','daily','gold',state.lastDailyRewardDate===todayKey())}</div></section>
  <section class="section"><div class="heading"><div><div class="eyebrow">Приключения рядом</div><h2>Сегодня в нашем дворе</h2></div><span class="pill">${state.done.filter(x=>QUESTS.some(q=>q.id===x)).length}/${QUESTS.length}</span></div>
  <div class="card"><div class="task-preview"><span class="qicon">${next?.icon||'🏅'}</span><div class="task-info"><b>${next?.title||'Ты настоящий герой двора!'}</b><p>${next?.desc||'Все поручения выполнены. Поговори с соседями.'}</p></div></div>${btn('К списку заданий →','goto:quests','secondary',false,true)}</div></section>
  <section class="section"><div class="heading"><div><div class="eyebrow">Собирай и улучшай</div><h2>Мастерская слияния</h2></div></div><div class="story-banner"><span class="medallion">🧩</span><div style="flex:1"><b>Одинаковые предметы становятся сильнее</b><p>Соединяй цветы, дерево и инструменты. Открывай полезные материалы для двора.</p></div></div><div style="margin-top:10px">${btn('Открыть поле слияния ✨','goto:merge','primary',false,true)}</div></section>
  <section class="section"><div class="heading"><div><div class="eyebrow">Преображение</div><h2>Построй свой уют</h2></div></div><div class="inventory"><span>🪙 ${state.coins}</span><span>🌱 Семена: ${state.inventory.seeds}</span><span>🪵 Доски: ${state.inventory.wood}</span></div><div class="build-grid" style="margin-top:12px">${BUILDINGS.map(b=>{
    const built=state.buildings.includes(b.id),enough=state.coins>=b.cost&&state.inventory.seeds>=b.seeds&&state.inventory.wood>=b.wood;
    return `<div class="build-card ${built?'built':''}"><div class="build-art">${b.icon}</div><b>${b.name}</b><p>${b.desc}</p><div class="build-cost">${built?'✓ Построено':`🪙 ${b.cost}${b.seeds?' · 🌱 '+b.seeds:''}${b.wood?' · 🪵 '+b.wood:''}`}</div>${btn(built?'Готово ✓':enough?'Построить':'Нужны материалы','build:'+b.id,built?'secondary':'primary',built||!enough)}</div>`}).join('')}</div></section>
  <section class="section"><div class="heading"><div><div class="eyebrow">За старой калиткой</div><h2>Новые места</h2></div></div>${placeCards()}</section>
  <section class="section"><p class="small" style="text-align:center">${btn('💾 Резервная копия прогресса','backup','secondary',false,true)}<br>Двор мечты · версия 1.17.1 · офлайн · автосохранение</p></section>`;
}
function mergeScreen(){const board=state.mergeBoard;return `<section class="section"><div class="merge-head"><strong>Волшебная мастерская</strong><p>Выбери два одинаковых предмета и объедини их в один более ценный.</p></div>
<div class="merge-controls">${btn('✨ Найти предмет · −1 ⚡','spawn','gold',state.energy<=0||board.every(Boolean))}${btn('♻️ Сдать выбранный','sell','secondary',selected<0)}</div>
<div class="merge-board" aria-label="Игровое поле 5 на 5">${board.map((tile,i)=>{const match=selected>=0&&selected!==i&&tile&&board[selected]&&tile.type===board[selected].type&&tile.level===board[selected].level&&tile.level<4;return `<button class="merge-cell ${tile?'':'empty'} ${selected===i?'selected':''} ${match?'target':''}" data-action="cell:${i}" aria-label="${tile?`${ITEMS[tile.type][tile.level-1].name}, уровень ${tile.level}`:'Пустая клетка'}">${tile?`<span>${ITEMS[tile.type][tile.level-1].icon}</span><span class="tile-star">${tile.level}</span><span class="tile-name">${ITEMS[tile.type][tile.level-1].name}</span>`:''}</button>`}).join('')}</div>
<p class="merge-tip">${selected>=0?'Выбран предмет. Нажми на такой же или на пустую клетку, чтобы переместить его.':'Нажми на предмет, затем на такой же. Два одинаковых превращаются в один!'} </p>
<div class="merge-legend"><span>⚡ ${state.energy}/${MAX_ENERGY} энергии</span><span>✨ ${state.mergeXP} очков мастерства</span><span>🧺 Свободно: ${board.filter(x=>!x).length}</span></div>
</section><section class="section"><div class="heading"><h2>Твои открытия</h2><span class="pill">Новые комбинации</span></div><div class="merge-collection">${Object.entries(ITEMS).map(([type,levels])=>{const lv=state.mergeBest[type];return `<div>${lv?levels[lv-1].icon:'❔'}<b>${({flower:'Цветы',wood:'Дерево',tool:'Инструменты'})[type]} · ${lv||'не открыто'}/4</b></div>`}).join('')}</div>
<div class="card" style="margin-top:10px"><b>💡 Полезный совет</b><p class="small">Соедини два ростка — получишь семена; две ветки — доску. Более редкие комбинации дают дополнительные монеты и приближают к новым заданиям. Энергия восстанавливается по одной каждые 5 минут, даже без интернета.</p></div></section>`}
function peopleScreen(){return `<section class="section"><div class="heading"><div><div class="eyebrow">Знакомься с соседями</div><h2>Герои нашей истории</h2></div><span class="pill">${HEROES.filter(x=>heroComplete(x.id)).length}/${HEROES.length} историй</span></div><div class="card"><p class="small" style="margin:0">У каждого соседа свой характер, мечта и личное поручение. Помогай героям и вместе создавайте двор, где всем хорошо.</p></div>
<div class="portraits" style="margin-top:12px">${HEROES.map(c=>`<div class="portrait-card ${heroUnlocked(c)?'':'locked'}"><img class="portrait" src="${heroPicture(c.id)}" alt="Портрет героя ${c.name}"><b>${c.name}</b><small>${c.role}</small>${btn(heroUnlocked(c)?heroComplete(c.id)?'Беседа':'Поговорить':`Ур. ${c.level}`,'talk:'+c.id,heroComplete(c.id)?'secondary':'primary',!heroUnlocked(c.id))}</div>`).join('')}</div></section>
<section class="section"><div class="heading"><h2>Истории героев</h2></div>${HEROES.map(c=>`<div class="card hero-story"><img class="portrait-large" src="${heroPicture(c.id)}" alt="${c.name}"><div class="body"><b>${c.name} · ${c.role}</b><div class="heart">${heroComplete(c.id)?'♥ ♥ ♥ · Дружба':'♥ ♡ ♡ · Знакомство'}</div><p>${c.tag}. ${c.quest}.</p><span class="pill ${heroComplete(c.id)?'done-pill':heroUnlocked(c)?'':'lock-pill'}">${heroComplete(c.id)?'✓ Помогли':heroUnlocked(c)?state.accepted.includes(c.id)?'Поручение принято':'Есть история':'Откроется на уровне '+c.level}</span></div></div>`).join('')}</section>`}
function questsScreen(){const count=QUESTS.filter(q=>state.done.includes(q.id)).length;return `<section class="section"><div class="heading"><div><div class="eyebrow">Путь преображения</div><h2>Задания двора</h2></div><span class="pill">${count}/${QUESTS.length}</span></div><div class="card"><div class="level-info"><div class="level-badge">🏆</div><div style="flex:1"><strong>Каждое доброе дело важно</strong><div class="small">Выполнено ${count} из ${QUESTS.length} заданий</div><div class="progress-wrap"><div class="progress-fill" style="width:${Math.round(count/QUESTS.length*100)}%"></div></div></div></div></div>
${QUESTS.map(q=>{const done=state.done.includes(q.id),prog=Math.min(q.total,questProgress(q)),ready=prog>=q.total;return `<div class="card"><div class="quest-row"><span class="qicon">${q.icon}</span><div class="qbody"><h3>${q.title}${done?' ✓':''}</h3><p>${q.desc}</p><div class="progress-wrap"><div class="progress-fill" style="width:${done?100:Math.round(prog/q.total*100)}%"></div></div><div class="quest-meta"><span class="small">${done?'Выполнено':`${prog} / ${q.total}`}</span><span class="pill ${done?'done-pill':''}">${done?'Получено':`+${q.reward} 🪙`}</span></div>${!done?btn(ready?'Получить награду':q.id==='clean'?'Убрать листья':q.id==='find'?'Осмотреть двор':q.id==='hello'?'К героям':q.id.startsWith('merge')||q.id==='flower_master'?'На поле слияния':'Перейти к цели',ready?'claim:'+q.id:questRoute(q.id),ready?'gold':'secondary'):''}</div></div></div>`}).join('')}</section>
<section class="section"><div class="heading"><h2>Заказ соседа</h2></div><div class="daily-banner"><span class="gift">📦</span><div class="body"><b>Помочь с хозяйством</b><p>${state.lastOrderDate===todayKey()?'Сегодня заказ уже выполнен.':'Сначала проведи хотя бы одно слияние, затем помоги соседу. Заказ доступен раз в день.'}</p></div></div><div style="margin-top:9px">${btn(state.lastOrderDate===todayKey()?'Уже выполнено':'Выполнить · +12 🪙','order','primary',state.lastOrderDate===todayKey()||state.mergeXP<5,true)}</div></section>`}
function questRoute(id){if(id==='clean')return 'cleanup';if(id==='find')return 'search';if(id==='hello'||id==='new_friend'||id==='friendship')return 'goto:people';if(id.startsWith('merge')||id==='flower_master')return 'goto:merge';if(id==='decorate')return 'goto:shop';return 'goto:home'}
function shopScreen(){return `<section class="section"><div class="heading"><div><div class="eyebrow">Маленькие радости</div><h2>Лавка украшений</h2></div><span class="pill">🪙 ${state.coins}</span></div><div class="story-banner"><span class="medallion">🎨</span><div><b>Твой двор — твой характер</b><p>Выбирай украшения за игровые монеты. Они навсегда останутся во дворе и сохранятся на устройстве.</p></div></div><div class="shop-grid" style="margin-top:12px">${DECOR.map(d=>{const owned=state.decor.includes(d.id);return `<div class="shop-card ${owned?'owned':''}"><div class="build-art">${d.icon}</div><b>${d.name}</b><p>${d.desc}</p><div class="build-cost">${owned?'✓ Куплено':'🪙 '+d.cost}</div>${btn(owned?'Украшает двор':`Купить`, 'decor:'+d.id,'secondary',owned||state.coins<d.cost)}</div>`}).join('')}</div></section><section class="section"><div class="heading"><h2>Особые предложения</h2></div><div class="card"><b>✨ Набор «Сад мечты»</b><p class="small">Будущие платные наборы станут доступны только после подключения официальной оплаты и проверки магазина.</p>${btn('Пока недоступно','noop','ghost',true,true)}</div><div class="card"><b>🚫 Отключение рекламы</b><p class="small">В текущей версии рекламы нет. Покупки и списания настоящих денег отключены.</p>${btn('Пока недоступно','noop','ghost',true,true)}</div></section>`}
function placeCards(){return PLACES.map(p=>{const open=state.places.includes(p.id),allowed=state.upgrades>=p.need&&state.coins>=p.cost;return `<div class="card"><div class="place-row"><div class="place-icon">${p.icon}</div><div class="body"><b>${p.name}</b><p>${p.desc}</p>${!open?`<span class="small">🪙 ${p.cost}</span>`:''}</div>${open?'<span class="pill done-pill">Открыто</span>':btn('Открыть','place:'+p.id,'secondary',!allowed)}</div></div>`}).join('')}
function modalFrame(title,content){return `<div class="modal-top"><h2>${title}</h2>${btn('✕ Закрыть','close','ghost')}</div>${content}`}
function dialogScreen(){if(dialog.type==='hero'){const h=HEROES.find(x=>x.id===dialog.id);if(!h)return '';const done=heroComplete(h.id),accepted=state.accepted.includes(h.id),ready=heroRequirement(h.id);let line=done?h.thanks:dialog.step===0?h.greet:accepted?h.accepted:h.quest;
return modalFrame('История соседа',`<div class="dialogue-head" style="margin-top:14px"><img class="portrait-large" src="${heroPicture(h.id)}" alt="${h.name}"><div class="body"><div class="eyebrow">${h.role}</div><h2>${h.name}</h2><div class="small">${h.tag}</div></div></div><div class="dialogue-box"><p>«${line}»</p>${!done&&dialog.step>0?`<p><b>Поручение:</b> ${h.quest}<br>${h.desc}<br><b>Награда:</b> ${h.reward} 🪙</p>`:''}</div><div class="dialogue-buttons">${done?btn('Как здорово, что мы познакомились!','close','primary',false,true):dialog.step===0?`${btn('Расскажи, как я могу помочь','herostep:'+h.id,'primary')}${btn('Поговорим позже','close','secondary')}`:!accepted?`${btn('Принять поручение','heroaccept:'+h.id,'primary')}${btn('Позже','close','secondary')}`:ready?`${btn('Поручение выполнено · +'+h.reward+' 🪙','herofinish:'+h.id,'gold')}`:`${btn('Продолжить помогать','close','primary')}<p class="small">Сначала: ${h.desc}</p>`}</div>`)}
if(dialog.type==='cleanup')return modalFrame('🧹 Чистая дорожка',`<p class="small">Нажми на каждый участок с листьями. Убранные места остаются чистыми.</p><div class="clean-grid">${['🍂','🍁','🌿'].map((v,i)=>`<button class="spot ${state.cleanupFound.includes(i)?'found':''}" data-action="clean:${i}" ${state.cleanupFound.includes(i)?'disabled':''}>${state.cleanupFound.includes(i)?'✨':v}</button>`).join('')}</div><p class="pill">${state.cleanupFound.length}/3 участков очищено</p>`);
if(dialog.type==='search')return modalFrame('🔎 Маленькие находки',`<p class="small">Осмотри три места. Каждое можно исследовать один раз за игровой день.</p><div class="search-grid">${['🪙','🌱','🪵'].map((v,i)=>{const looked=state.history.includes(`find_${i}_${state.day}`);return `<button class="spot ${looked?'found':''}" data-action="find:${i}" ${looked?'disabled':''}>${looked?'✨':v}</button>`}).join('')}</div><p class="pill">Найдено: ${state.finds}/3</p>`);
if(dialog.type==='story'){const chapter=currentStoryIndex();return modalFrame(STORY[chapter][0],`<div class="dialogue-box"><p>${STORY[chapter][1]}</p></div><p class="small" style="margin:14px 0">Следующая глава откроется, когда ты построишь новые объекты и исследуешь соседний сад.</p>${btn('Продолжить приключение','close','primary',false,true)}`)}
if(dialog.type==='backup')return modalFrame('💾 Сохранить прогресс',`<p class="small">Если устанавливаешь другую Android-сборку, заранее скопируй этот текст в заметки. Он содержит все монеты, задания, материалы, постройки и слияния.</p><label class="small" for="save-export"><b>Резервная копия</b></label><textarea id="save-export" readonly aria-label="Текст резервной копии" style="width:100%;height:115px;resize:vertical;margin:8px 0;padding:10px;border:1px solid #d9d5c3;border-radius:11px;font-size:11px;background:#f4f4eb"></textarea>${btn('📋 Скопировать копию','copybackup','primary',false,true)}<div class="divider"></div><label for="restore-text" class="small"><b>Восстановить из копии</b></label><textarea id="restore-text" placeholder="Вставь сюда ранее сохранённый текст…" aria-label="Текст для восстановления" style="width:100%;height:95px;resize:vertical;margin:8px 0;padding:10px;border:1px solid #d9d5c3;border-radius:11px;font-size:11px"></textarea>${btn('Восстановить прогресс','restore','secondary',false,true)}<p class="small">Восстановление заменит текущий прогресс. Перед этим лучше сохранить его копию.</p>`);
if(dialog.type==='help')return modalFrame('Как играть',`<div class="dialogue-box"><p><b>1. Слияние:</b> нажми на одинаковые предметы на поле 5 × 5, чтобы получить новый предмет. Энергию можно восстановить со временем.</p><p><b>2. Постройка:</b> получай доски и семена из слияний и поиска, строй клумбу, скамейку, фонарь и фонтан.</p><p><b>3. Герои:</b> знакомься с соседями, принимай их поручения, помогай им и открывай новые истории.</p><p><b>4. Задания:</b> забирай награды после выполнения условий; за одно задание награда выдаётся только один раз.</p><p><b>5. Сохранение:</b> прогресс автоматически сохраняется на этом телефоне и доступен офлайн.</p></div>${btn('Понятно, играть!','close','primary',false,true)}`);
return ''}
function setTab(next){if(!['home','merge','people','quests','shop'].includes(next))return;tab=next;dialog=null;selected=-1;render();window.scrollTo(0,0)}
function improveLevel(){state.level=Math.max(state.level,1+Math.floor(state.upgrades/2))}
function addMergeReward(tile){const {type,level}=tile;if(level===2){if(type==='flower'){state.inventory.seeds+=1;toast('Получено: семена +1 🌱')}else if(type==='wood'){state.inventory.wood+=1;toast('Получено: доска +1 🪵')}else{state.coins+=7;toast('Отличный инструмент! +7 🪙')}}else if(level>=3){state.coins+=level*5;if(type==='flower')state.inventory.seeds+=1;if(type==='wood')state.inventory.wood+=1;toast('Редкое объединение! Бонус +'+(level*5)+' 🪙')}else toast('Предмет улучшен!')}
function boardCell(index){const board=state.mergeBoard,tile=board[index];if(selected<0){if(tile){selected=index;render()}else toast('Выбери предмет, чтобы переместить его или объединить');return}
if(index===selected){selected=-1;render();return}const source=board[selected];if(!source){selected=-1;render();return}
if(!tile){board[index]=source;board[selected]=null;selected=-1;save();render();return}
if(tile.type===source.type&&tile.level===source.level&&tile.level<4){const level=tile.level+1;board[index]={type:tile.type,level};board[selected]=null;state.mergeXP+=5*level;state.mergeBest[tile.type]=Math.max(state.mergeBest[tile.type],level);selected=-1;addMergeReward(board[index]);save();render();return}
selected=index;render();toast('Для слияния нужны два одинаковых предмета')}
function spawn(){regenerate();if(state.energy<1)return toast('Энергия восстановится через несколько минут');const free=state.mergeBoard.map((v,i)=>v?null:i).filter(i=>i!==null);if(!free.length)return toast('Поле заполнено. Объединяй предметы или перемещай их!');const index=free[Math.floor(Math.random()*free.length)];const roll=Math.random();state.mergeBoard[index]={type:roll<.40?'flower':roll<.76?'wood':'tool',level:1};state.energy--;if(state.energy===MAX_ENERGY-1)state.lastEnergyAt=Date.now();selected=-1;save();render()}
function acceptHero(id){const h=HEROES.find(x=>x.id===id);if(!h||!heroUnlocked(h))return;if(!state.accepted.includes(id))state.accepted.push(id);dialog={type:'hero',id,step:1};save();render()}
function finishHero(id){const h=HEROES.find(x=>x.id===id);if(!h||!heroUnlocked(h)||!state.accepted.includes(id)||heroComplete(id)||!heroRequirement(id))return;
state.done.push('char_'+id);state.coins+=h.reward;state.friendship[id]=3;dialog={type:'hero',id,step:1};save();render();toast('Спасибо за помощь! +'+h.reward+' 🪙')}
function completeQuest(id){const q=QUESTS.find(x=>x.id===id);if(!q||state.done.includes(id)||questProgress(q)<q.total)return toast('Сначала выполни условия задания');state.done.push(id);state.coins+=q.reward;save();render();toast('Задание выполнено! +'+q.reward+' 🪙')}
function act(action){if(typeof action!=='string')return;
  if(action.startsWith('goto:'))return setTab(action.slice(5));
  if(action==='close'){dialog=null;render();return}
  if(action==='help'||action==='story'||action==='cleanup'||action==='search'||action==='backup'){dialog={type:action};render();return}
  if(action==='copybackup'){const input=el('save-export');if(!input)return;input.focus?.();input.select?.();const ok=typeof document.execCommand==='function'&&document.execCommand('copy');toast(ok?'Копия скопирована!':'Текст выделен. Скопируй его вручную.');return}
  if(action==='restore'){const value=el('restore-text')?.value?.trim();if(!value)return toast('Сначала вставь текст резервной копии');try{const obj=JSON.parse(value);if(!obj||typeof obj!=='object'||Array.isArray(obj)||!('coins' in obj)||!('buildings' in obj))throw Error('invalid');if(typeof window.confirm==='function'&&!window.confirm('Заменить текущий игровой прогресс данными из копии?'))return;localStorage.setItem(SAVE,JSON.stringify(obj));state=load();selected=-1;dialog=null;tab='home';render();toast('Прогресс восстановлен!')}catch(_){toast('Не удалось прочитать копию. Проверь весь текст.')}return}
  if(action==='unselect'){selected=-1;render();return}
  if(action==='sell'){if(selected<0||!state.mergeBoard[selected])return;const tile=state.mergeBoard[selected];const reward=2*tile.level*tile.level;state.mergeBoard[selected]=null;state.coins+=reward;selected=-1;save();render();toast('Предмет сдан: +'+reward+' 🪙');return}
  if(action==='spawn'){spawn();return}
  if(action.startsWith('cell:')){const i=Number(action.slice(5));if(Number.isInteger(i)&&i>=0&&i<25)boardCell(i);return}
  if(action.startsWith('talk:')){const id=action.slice(5),h=HEROES.find(x=>x.id===id);if(!h||!heroUnlocked(h))return toast('Этот герой появится на более высоком уровне');if(!state.talked.includes(id)){state.talked.push(id);save()}dialog={type:'hero',id,step:0};render();return}
  if(action.startsWith('herostep:')){const id=action.slice(9);dialog={type:'hero',id,step:1};render();return}
  if(action.startsWith('heroaccept:'))return acceptHero(action.slice(11));
  if(action.startsWith('herofinish:'))return finishHero(action.slice(11));
  if(action.startsWith('claim:'))return completeQuest(action.slice(6));
  if(action.startsWith('clean:')){const i=Number(action.slice(6));if(!Number.isInteger(i)||i<0||i>2||state.done.includes('clean'))return;if(!state.cleanupFound.includes(i))state.cleanupFound.push(i);if(state.cleanupFound.length===3){dialog=null;toast('Дорожка чистая! Забери награду в заданиях.')}save();render();return}
  if(action.startsWith('find:')){const i=Number(action.slice(5)),key=`find_${i}_${state.day}`;if(!Number.isInteger(i)||i<0||i>2||state.history.includes(key))return;state.history.push(key);state.finds=Math.min(3,state.finds+1);if(i===0){state.coins+=4;toast('Находка: монетка +4 🪙')}if(i===1){state.inventory.seeds++;toast('Находка: семена +1 🌱')}if(i===2){state.inventory.wood++;toast('Находка: доска +1 🪵')}if(state.finds>=3){dialog=null;toast('Три находки собраны! Забери награду.')}save();render();return}
  if(action.startsWith('build:')){const id=action.slice(6),b=BUILDINGS.find(v=>v.id===id);if(!b||state.buildings.includes(id))return;if(state.coins<b.cost||state.inventory.seeds<b.seeds||state.inventory.wood<b.wood)return toast('Не хватает материалов или монет');state.coins-=b.cost;state.inventory.seeds-=b.seeds;state.inventory.wood-=b.wood;state.buildings.push(id);state.upgrades++;improveLevel();save();render();toast('Готово! '+b.name+' построена!');return}
  if(action.startsWith('place:')){const id=action.slice(6),p=PLACES.find(v=>v.id===id);if(!p||state.places.includes(id))return;if(state.upgrades<p.need||state.coins<p.cost)return toast('Сначала улучши двор и накопи монеты');state.coins-=p.cost;state.places.push(id);save();render();toast('Открыто: '+p.name);return}
  if(action.startsWith('decor:')){const id=action.slice(6),d=DECOR.find(v=>v.id===id);if(!d||state.decor.includes(id))return;if(state.coins<d.cost)return toast('Не хватает монет');state.coins-=d.cost;state.decor.push(id);save();render();toast('Украшение установлено!');return}
  if(action==='daily'){const today=todayKey();if(state.lastDailyRewardDate===today)return toast('Сегодня подарок уже получен');state.dailyStreak=state.lastDailyRewardDate===yesterdayKey()?Math.min(7,(state.dailyStreak||0)+1):1;const reward=20+5*(state.dailyStreak-1);state.coins+=reward;state.energy=Math.min(MAX_ENERGY,state.energy+4);state.lastDailyRewardDate=today;save();render();toast('Подарок: +'+reward+' 🪙 и +4 ⚡');return}
  if(action==='order'){const today=todayKey();if(state.lastOrderDate===today)return toast('Сегодня заказ уже выполнен');if(state.mergeXP<5)return toast('Сначала попробуй объединить два предмета');state.lastOrderDate=today;state.neighborOrders++;state.coins+=12;state.day++;save();render();toast('Помощь соседу: +12 🪙');return}
}
window.handleAndroidBack=function(){if(dialog){dialog=null;render();return 'stay'}if(tab!=='home'){setTab('home');return 'stay'}return 'exit'};
document.addEventListener('click',event=>{const button=event.target.closest?.('button');if(!button||button.disabled)return;if(button.dataset.tab)return setTab(button.dataset.tab);if(button.dataset.action)return act(button.dataset.action)});
el('overlay').addEventListener('click',event=>{if(event.target===el('overlay')){dialog=null;render()}});

window.DvorMechtyDebug=Object.freeze({getState:()=>JSON.parse(JSON.stringify(state)),save,load,render,questProgress,act});
render();
})();
